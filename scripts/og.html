<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/fraunces/index.css">
<link rel="stylesheet" href="../node_modules/@fontsource-variable/public-sans/index.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #faf5ee; color: #29231d;
    font-family: 'Public Sans Variable', system-ui, sans-serif;
    display: grid; grid-template-columns: 566px 1fr;
  }
  .copy { padding: 68px 0 68px 68px; display: flex; flex-direction: column; justify-content: space-between; }
  .eyebrow { font-size: 17px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: #ae652b; margin: 0; }
  h1 { font-family: 'Fraunces Variable', Georgia, serif; font-weight: 340; font-size: 60px; line-height: 1.05; letter-spacing: -.02em; margin: 0; }
  .strap { font-size: 21px; line-height: 1.45; color: #4e4640; margin: 0; }
  .shot { position: relative; overflow: hidden; }
  .shot img { position: absolute; left: 40px; top: 52px; width: 1240px; border-radius: 10px; box-shadow: 0 24px 60px rgba(41,35,29,.28); }
</style>
</head>
<body>
  <div class="copy">
    <p class="eyebrow">Otter Crew's Poker Assistant</p>
    <h1>Find your leaks. Build a better game.</h1>
    <p class="strap">Free forever heads-up GTO. Your hands never leave your device.</p>
  </div>
  <div class="shot"><img src="../src/assets/screens/S1.png" alt=""></div>
</body>
</html>
